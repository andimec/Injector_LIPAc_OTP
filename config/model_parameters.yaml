# Initial training-model assumptions. NOT calibrated hardware properties.
#
# Sources for reference operating points:
# - BA_D_2E9QH7 v2.0 (2026), Injector CW operating procedure:
#   source coils 41.6/87.8 A, solenoids 280/0 A, HV 100 kV,
#   RF 880 W and approximately 2.3 sccm D2.
# - BA_D_2E2GU7 v1.0 (2026), startup after maintenance.
#
# The initial rates below are training defaults, not measured power
# electronics transfer functions. Each can be replaced by fit/validation.
supplies:
  SRC:COIL01_PS:
    current_rate_per_s: 1.0
  SRC:COIL02_PS:
    current_rate_per_s: 1.0
  LEBT:SOL01_PS:
    current_rate_per_s: 2.0
  LEBT:SOL02_PS:
    current_rate_per_s: 2.0
  LEBT:HV_PS:
    voltage_rate_per_s: 1.0
  SRC:IE_PS:
    voltage_rate_per_s: 1.0

vacuum:
  initial_pressure_mbar: 1.0e-6
  base_pressure_mbar: 1.0e-8
  vacuum_ok_threshold_mbar: 1.0e-5
  pumping_tau_s: 10.0
  leak_rate_mbar_s: 2.0e-8
  gas_coupling_mbar_s_per_sccm: 2.0e-6
  fault_inrush_mbar_s: 1.0e-3
  # Training hypothesis: no cross-region conductance until a network
  # model has volumes, pump curves and GV conductance data.
  flow_sources:
    LEBT:VAC01: [SRC:MFCD, SRC:MFCH]
    LEBT:VAC02: [LEBT:MFC]

gas:
  response_tau_s: 0.5

rf:
  warmup_s: 4.0
  power_tau_s: 0.5
  reference_stub_x: 1860
  reference_stub_y: 2756
  minimum_reflection_fraction: 0.02
  # RF_GENE Modbus registers define two independent settings; the physical
  # effect of RfOffset is NOT calibrated. Zero avoids inventing RF+offset.
  rf_offset_effect_gain: 0.0

beam:
  nominal_faraday_current_mA: 145.0
  reference_rf_W: 880.0
  reference_d2_sccm: 2.3
  reference_hv_kV: 100.0

# BA_D_2E9QH7 v2.0 gives 1 kV HV/IE increments at 1 s intervals.
# Repeller 0.1 kV increments are stated without a dwell time.
# 1 s repeller dwell and 20 s settling timeout are TRAINING ASSUMPTIONS.
auto_hv:
  hv_ie_step_interval_s: 1.0
  repeller_step_interval_s: 1.0
  feedback_timeout_s: 20.0

# EMU dynamics are TRAINING assumptions, distinct from verified SNL logic.
# Source for geometry, state ordering and motor field limits:
# topIFMIF_INJ/emitApp/src/emitSnlEmu_v2.st and emitMotor.db.
# Source for MaxV/servo timing: emitSnlMotor.st (1 s per stage).
emu:
  enable_stage_delay_s: 1.0
  motor:
    initial_position_mm: 0.0
    rate_mm_s: 20.0       # TODO fit from recorded motor motion
    position_tolerance_mm: 0.01  # SNL v2 verifMoteur absolute threshold
    lower_limit_mm: -3.0  # original motor DLLM
    upper_limit_mm: 182.0 # original motor DHLM
  plates:
    plate_rate_V_s: 10000.0 # TODO fit real ICV714/150 response
    turn_on_delay_s: 0.0    # source ODLY=30 off, 0 on is NOT physical response
  facq:
    synthetic_enabled: true
    synthetic_period_s: 0.1  # simulation clock, NOT real fast acquisition rate
  scan:
    motor_tolerance_mm: 0.01
    voltage_fraction_tolerance: 0.02
    voltage_absolute_tolerance_V: 2.0
    enable_timeout_s: 15.0
    motor_timeout_s: 30.0
    plate_timeout_s: 30.0
    acquisition_timeout_s: 10.0
    max_targets: 20000
    min_motor_limit_mm: -3.0
    max_motor_limit_mm: 182.0
