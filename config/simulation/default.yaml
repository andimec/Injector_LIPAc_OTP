# Default simulation startup configuration.
# This file defines initial conditions only.
# Calculated interlock outputs and model readbacks must not be configured here.
# Raw PPS permits and physical safety signals are external scenario conditions.

simulation:
  initial_state: "OFF"
  timestep_s: 0.1

external_conditions:
  vacuum:
    ready: true
  cooling:
    ready: true
  gas:
    available: true
  magnets:
    ready: true
  rf:
    ready: true

initial_pvs:
  LEBT:HV:RoomKeyA1: true
  LEBT:HV:RlyRmtStat: true
  LEBT:HV:RlyCloseStat: true
  LEBT:VAC01:SGVCDefStat: true
  LEBT:VAC02:SGVCDefStat: true
  SRC:IE_PS:ExtSec: true
  LEBT:HV_PS:ExtSec: true
  LEBT:HV:RlyDefOpen: true
  INJ:WS:ResPCDefStat: true
  SRC:COIL01:FSDefStat: true
  SRC:COIL02:FSDefStat: true
  SRC:RF:FSDefStat: true
  PPS:HV:PermStat: true
  PPS:SVL:D2PermStat: true
  PPS:SVL:H2PermStat: true
  PPS:GV:OpenPermStat: true
  PPS:PLSM:PermStat: true
  PPS:CHOP:PermStat: true
  PPS:ACCL:PermStat: true
  PPS:BEAM:InhibitStat: false
  # LCS User Manual v4.0 section 4.4.2. These are configurable
  # operator threshold inputs to a TRAINING CIM, not FPGA comparisons.
  LEBT:CHOP_IM:VmonOff: 1000.0
  LEBT:CHOP_IM:VmonThr: 6000.0
  LEBT:CHOP_IM:AcctThr: 5.0

device_faults: {}
